<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Web Medica</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f4f7f6;
            color: #333;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        p {
            color: #666;
            margin-bottom: 24px;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 16px; /* Separación uniforme entre botones */
            width: 100%;
            max-width: 320px; /* Ancho máximo en móviles y PC */
            padding: 0 20px;
            box-sizing: border-box;
        }

        .btn {
            display: block;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            color: #ffffff;
            background-color: #0f172a; /* Azul oscuro moderno/slate */
            border-radius: 12px; /* Bordes redondeados modernos */
            font-weight: 600;
            font-size: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease-in-out;
        }

        /* Efecto al pasar el ratón por encima (Hover) */
        .btn:hover {
            background-color: #1e293b;
            transform: translateY(-2px); /* Pequeño salto hacia arriba */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        }

        /* Efecto al hacer clic */
        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <h1>Web de Seguimiento de Paco Martinez</h1>
    <p>Elige que Opcion Quieres Ver:</p>
    
    <div class="button-container">
        <a href="https://fmartinezgutierrez2015.github.io/Agenda.html#table2" target="_blank" class="btn">Agenda</a>
        <a href="https://fmartinezgutierrez2015.github.io/CalculadoraMed.html" target="_blank" class="btn">Medicamentos</a>
        <a href="https://fmartinezgutierrez2015.github.io/lista_de_tomas.html" target="_blank" class="btn">Tomas Diarias</a>
        <a href="https://fmartinezgutierrez2015.github.io/ippublica.html" target="_blank" class="btn">IP Publica</a>
    </div>

</body>
</html>
